<section class="calculator" aria-labelledby="calc-title" hidden>
  <div class="calc-head">
    <div><p class="section-kicker">合成算例</p><h3 id="calc-title">日前与实时偏差结算试算</h3></div>
    <button class="reset" type="reset" form="settlement-form">重置</button>
  </div>
  <p>日前充电 12 MWh，价格 100 元/MWh。日前放电 10 MWh，价格 500 元/MWh。修改实际计量或实时结算价，查看两窗净现货电费。</p>
  <form id="settlement-form">
    <div class="calc-inputs">
      <label>实际充电量 <span>MWh</span><input name="charge" type="number" min="0" max="15" step="0.01" value="14" required></label>
      <label>实时充电价 <span>元/MWh</span><input name="chargePrice" type="number" step="0.01" value="130" required></label>
      <label>实际放电量 <span>MWh</span><input name="discharge" type="number" min="0" max="15" step="0.01" value="8" required></label>
      <label>实时放电价 <span>元/MWh</span><input name="dischargePrice" type="number" step="0.01" value="600" required></label>
    </div>
    <div class="calc-results" aria-live="polite">
      <div><span>购电成本</span><output id="cost">1,460 元</output></div>
      <div><span>售电收入</span><output id="revenue">3,800 元</output></div>
      <div class="net"><span>净现货电费</span><output id="net">2,340 元</output></div>
    </div>
    <p class="calc-status" id="calc-status">单时段电量上限按 60 MW × 0.25 h。此处计算电费，SOC 可行性及其他费用按报告另行校验。</p>
  </form>
</section>
